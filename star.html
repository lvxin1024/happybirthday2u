<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 土星粒子系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #111827 0%, #050505 55%, #000 100%);
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        canvas {
            display: block;
        }

        #input_video {
            position: absolute;
            top: -1000px;
            left: -1000px;
            transform: scaleX(-1);
        }

        #hint {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.78);
            font-size: 13px;
            letter-spacing: 0.04em;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            padding: 8px 14px;
            pointer-events: none;
            backdrop-filter: blur(10px);
        }

        #message {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 8;
            width: min(88vw, 900px);
            text-align: center;
            color: rgba(255, 255, 255, 0);
            font-size: clamp(20px, 2.2vw, 34px);
            line-height: 1.8;
            letter-spacing: 0.04em;
            text-shadow: 0 0 18px rgba(255, 255, 255, 0.18);
            opacity: 0;
            pointer-events: none;
            user-select: none;
            transition: opacity 120ms linear, transform 120ms linear, color 120ms linear;
            will-change: opacity, transform, color;
        }

        #message.visible {
            color: rgba(255, 255, 255, 0.96);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <video id="input_video" autoplay playsinline muted></video>
    <div id="message">我们每一个人，都由无数个十万分之一的幸存粒子组成，散落在数十亿的人海。所以我和你相遇是无数个微小粒子前赴后继、湮灭碰撞创造出来的奇迹,珍贵又难得。很高兴认识你，21岁的曹晓彤</div>

    <script>
        const PARTICLE_COUNT = 25000;
        const PARTICLE_SIZE = 0.08;
        const TRANSITION_SPEED = 0.08;
        const HAND_SENSITIVITY = 0.15;
        const TEXT_FADE_START = 1.55;
        const TEXT_FADE_END = 2.25;

        let scene, camera, renderer, controls;
        let particles, geometry, material;
        let basePositions;
        let handScaleFactor = 1.0;
        let targetHandScale = 1.0;
        let textOpacity = 0;
        let targetTextOpacity = 0;
        let displayMode = new URLSearchParams(window.location.search).get('mode') === 'bg' ? 'bg' : 'full';
        let bgRotationX = 0.3;
        let bgRotationY = 0.0;

        const videoElement = document.getElementById('input_video');
        const messageEl = document.getElementById('message');
        const hintEl = document.getElementById('hint');
        let sharedStreamFramePending = false;
        let handsInstance = null;
        let sharedStreamStarted = false;
        let fallbackCameraStarted = false;

        function clamp(value, min, max) {
            return Math.min(max, Math.max(min, value));
        }

        function applyMode(mode) {
            displayMode = mode === 'bg' ? 'bg' : 'full';
            const isBackgroundMode = displayMode === 'bg';

            messageEl.hidden = isBackgroundMode;
            hintEl.hidden = isBackgroundMode;

            if (controls) {
                controls.enabled = !isBackgroundMode;
            }

            if (isBackgroundMode) {
                targetTextOpacity = 0;
                textOpacity = 0;
                messageEl.style.opacity = '0';
                controls.enabled = false;
            } else {
                controls.enabled = true;
            }
        }

        function applyHandScale(scale) {
            targetHandScale = scale;

            if (displayMode !== 'bg') {
                targetTextOpacity = clamp((targetHandScale - TEXT_FADE_START) / (TEXT_FADE_END - TEXT_FADE_START), 0, 1);
            }
        }

        async function startHandsWithSharedStream(stream) {
            if (!handsInstance || sharedStreamStarted || !stream) {
                return;
            }

            sharedStreamStarted = true;
            videoElement.srcObject = stream;

            try {
                await videoElement.play();
            } catch (error) {
                sharedStreamStarted = false;
                return;
            }

            const processFrame = async () => {
                if (!sharedStreamStarted) {
                    return;
                }

                if (sharedStreamFramePending || videoElement.readyState < 2) {
                    requestAnimationFrame(processFrame);
                    return;
                }

                sharedStreamFramePending = true;

                try {
                    await handsInstance.send({ image: videoElement });
                } finally {
                    sharedStreamFramePending = false;
                    requestAnimationFrame(processFrame);
                }
            };

            processFrame();
        }

        function startCameraUtilsTracking() {
            if (!handsInstance || fallbackCameraStarted || sharedStreamStarted) {
                return;
            }

            fallbackCameraStarted = true;

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await handsInstance.send({ image: videoElement });
                },
                width: 320,
                height: 240
            });

            cameraUtils.start().catch(() => {
                fallbackCameraStarted = false;
                // 摄像头不可用时，仍然保留静态土星展示
            });
        }

        function getPointOnSaturn() {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);

            if (Math.random() > 0.4) {
                const r = 6 * Math.cbrt(Math.random());
                return {
                    x: r * Math.sin(phi) * Math.cos(theta),
                    y: r * Math.sin(phi) * Math.sin(theta),
                    z: r * Math.cos(phi)
                };
            }

            const rInner = 8;
            const rOuter = 14;
            const r = Math.sqrt(Math.random() * (rOuter * rOuter - rInner * rInner) + rInner * rInner);
            let x = r * Math.cos(theta);
            let z = r * Math.sin(theta);
            let y = (Math.random() - 0.5) * 0.5;

            const tilt = 0.4;
            const yt = y * Math.cos(tilt) - z * Math.sin(tilt);
            const zt = y * Math.sin(tilt) + z * Math.cos(tilt);
            y = yt;
            z = zt;

            return { x, y, z };
        }

        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 25);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.minDistance = 12;
            controls.maxDistance = 60;
            controls.enablePan = false;

            geometry = new THREE.BufferGeometry();
            basePositions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const point = getPointOnSaturn();
                const offset = i * 3;
                basePositions[offset] = point.x;
                basePositions[offset + 1] = point.y;
                basePositions[offset + 2] = point.z;

                const isRing = Math.abs(point.y) < 1.0 && Math.abs(point.x) > 7;
                colors[offset] = isRing ? 0.18 : 0.45;
                colors[offset + 1] = isRing ? 0.52 : 0.72;
                colors[offset + 2] = 1.0;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(basePositions.slice(), 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            material = new THREE.PointsMaterial({
                color: 0x7dc8ff,
                size: PARTICLE_SIZE,
                sizeAttenuation: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.82,
                vertexColors: true
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onHandsResults(results) {
            if (displayMode === 'bg') {
                targetTextOpacity = 0;
            }

            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                targetHandScale = 1.0;
                if (displayMode !== 'bg') {
                    targetTextOpacity = 0;
                }
                return;
            }

            const landmarks = results.multiHandLandmarks[0];
            const wrist = landmarks[0];
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const indexBase = landmarks[5];

            const palmSize = Math.hypot(indexBase.x - wrist.x, indexBase.y - wrist.y);
            const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);

            const minRatio = 0.2;
            const maxRatio = 1.2;
            const minScale = 0.3;
            const maxScale = 2.5;

            let normalized = (pinchDist / (palmSize || 0.1) - minRatio) / (maxRatio - minRatio);
            normalized = clamp(normalized, 0, 1);

            const scale = minScale + normalized * (maxScale - minScale);
            applyHandScale(scale);
        }

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data) {
                return;
            }

            if (data.type === 'saturn-drag' && displayMode === 'bg') {
                bgRotationY += (data.dx || 0) * 0.006;
                bgRotationX += (data.dy || 0) * 0.004;
                return;
            }

            if (data.type === 'saturn-camera-stream') {
                startHandsWithSharedStream(data.stream);
                return;
            }

            if (data.type === 'saturn-hand-scale') {
                applyHandScale(typeof data.scale === 'number' ? data.scale : 1);
                return;
            }

            if (data.type !== 'saturn-mode') {
                return;
            }

            applyMode(data.mode);
        });

        function initHands() {
            handsInstance = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            handsInstance.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            handsInstance.onResults(onHandsResults);

            if (window.parent !== window) {
                return;
            }

            startCameraUtilsTracking();
        }

        function updateMessageVisibility() {
            if (displayMode === 'bg') {
                return;
            }

            textOpacity += (targetTextOpacity - textOpacity) * HAND_SENSITIVITY;
            messageEl.style.opacity = textOpacity.toFixed(3);
            messageEl.style.transform = `translate(-50%, calc(-50% + ${(1 - textOpacity) * 18}px)) scale(${0.98 + textOpacity * 0.02})`;
            messageEl.classList.toggle('visible', textOpacity > 0.02);
        }

        function animate() {
            requestAnimationFrame(animate);

            handScaleFactor += (targetHandScale - handScaleFactor) * HAND_SENSITIVITY;
            updateMessageVisibility();

            const positions = particles.geometry.attributes.position.array;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const ix = i * 3;
                const iy = i * 3 + 1;
                const iz = i * 3 + 2;

                const tx = basePositions[ix] * handScaleFactor;
                const ty = basePositions[iy] * handScaleFactor;
                const tz = basePositions[iz] * handScaleFactor;

                positions[ix] += (tx - positions[ix]) * TRANSITION_SPEED;
                positions[iy] += (ty - positions[iy]) * TRANSITION_SPEED;
                positions[iz] += (tz - positions[iz]) * TRANSITION_SPEED;
            }

            particles.geometry.attributes.position.needsUpdate = true;

            if (displayMode === 'bg') {
                bgRotationY += 0.0015;
                particles.rotation.x = bgRotationX;
                particles.rotation.y = bgRotationY;
                particles.rotation.z = 0.3;
            } else {
                particles.rotation.y += 0.002;
                particles.rotation.z = 0.3;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        initThree();
        applyMode(displayMode);
        initHands();
        animate();
    </script>
</body>
</html>
